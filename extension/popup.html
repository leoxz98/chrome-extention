<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Analizador de Noticias</title>
  <link rel="stylesheet" href="style.css" />
  <!-- Incluimos Chart.js -->
  <script src="chart.umd.js"></script>
  <script src="html2pdf.bundle.min.js"></script>


</head>
<body>

  <!-- Barra de pestañas -->
  <div class="tabs">
    <button class="tab-button" id="btn-home">🏠 Inicio</button>
    <button class="tab-button" id="btn-result">📊 Análisis</button>
    <button class="tab-button" id="btn-chat">💬 Chat IA</button>
    <button class="tab-button" id="share-btn">Compartir</button>
    <button class="tab-button" id="clear-btn">Borrar todo</button>
  </div>

  <!-- Sección Inicio -->
  <div class="section" id="section-home">
    <div class="content">
      <h2>Selección de noticia</h2>
      <textarea id="input-text" placeholder="Pega aquí el texto de la noticia..."></textarea>
      <button id="send-btn">Analizar</button>
      <button id="auto-btn">Copiar automático</button>
      <p id="status-msg"></p>
    </div>
  </div>

<!-- Sección Resultados -->
<div class="section hidden" id="section-result">
  <div class="content">
    <h2>Resultado del Análisis</h2>

    <div id="result-container">
      <h4>Titular</h4>
      <div id="titular"></div>

      <h4>Resumen</h4>
      <div id="resumen"></div>

      <h4>Sesgos Detectados</h4>
      <div style="display: flex; border: 1px solid black; padding: 10px; gap: 20px; align-items: flex-start; max-width: 700px;">
        
<!-- Columna de texto: sesgos -->
<div style="flex: 1;">
  <ul id="lista-sesgos" style="list-style-type: none; padding: 0;"></ul>
</div>



      
        <!-- Columna de gráficos -->
        <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 20px;">
          <canvas id="sentimientoChart" width="200" height="200"></canvas>
          <canvas id="polarizacionChart" width="250" height="90"></canvas>
        </div>
      
      </div>
      
      
      <h4>Actores principales</h4>
      <div id="actores-container"></div>

      <h4>Noticias Similares</h4>
      <div id="noticias-similares"></div>
      
    </div>
  </div>
</div>


  <!-- Sección Chat -->
  <div class="section hidden" id="section-chat">
    <div class="content">
      <div id="chat">
        <div id="messages"></div>
        <input id="user-input" placeholder="Escribe tu mensaje..." />
        <button id="send">Enviar</button>
      </div>
    </div>
  </div>

  <!-- Sección compartir -->
  <div class="section hidden" id="section-share">
    <div class="content">
      <div id="share">
        <h4>Descargar</h4>
        <button id="djson">Json</button>
        <button id="dpdf">Pdf</button>
        <h4>Compartir</h4>
        <button id="cwsp">Whatsapp</button>
        <button id="cx">XdotCom</button>
      </div>
    </div>
  </div>


  <script src="popup.js"></script>
</body>
</html>
