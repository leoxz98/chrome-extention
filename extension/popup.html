<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Analizador de Noticias</title>
  <link rel="stylesheet" href="style.css" />
  <!-- Incluimos Chart.js -->
  <script src="chart.umd.js"></script>

</head>
<body>

  <!-- Barra de pestañas -->
  <div class="tabs">
    <button class="tab-button" id="btn-home">🏠 Inicio</button>
    <button class="tab-button" id="btn-result">📊 Análisis</button>
    <button class="tab-button" id="btn-chat">💬 Chat IA</button>
    <button class="tab-button" id="clear-btn">Borrar todo</button>
  </div>

  <!-- Sección Inicio -->
  <div class="section" id="section-home">
    <div class="content">
      <h2>Selección de noticia</h2>
      <textarea id="input-text" placeholder="Pega aquí el texto de la noticia..."></textarea>
      <button id="send-btn">Analizar</button>
      <button id="auto-btn">Copiar automático</button>
      <p id="status-msg"></p>
    </div>
  </div>

  <!-- Sección Resultados -->
  <div class="section hidden" id="section-result">
    <div class="content">
      <h2>Resultado del Análisis</h2>

      <div id="result-container">
        <h4>Titular</h4>
        <div id="titular"></div>
      
        <h4>Actores principales</h4>
        <div id="actores-container"></div>
      
        <h4>Análisis Crítico</h4>
        <div id="analisis-critico">
          <!-- Gráficos de tarta -->
          <h5>Sentimientos</h5>
          <canvas id="sentimientoChart" width="300" height="300"></canvas>

          <h5>Discurso de odio</h5>
          <canvas id="hateSpeechChart" width="300" height="300"></canvas>

          <h5>Emociones</h5>
          <canvas id="emocionesChart" width="300" height="300"></canvas>

          <h5>Ironía</h5>
          <canvas id="ironiaChart" width="300" height="300"></canvas>
        </div>

        <h4>Noticias Similares</h4>
        <div id="noticias-similares"></div>
      </div>
    </div>
  </div>

  <!-- Sección Chat -->
  <div class="section hidden" id="section-chat">
    <div class="content">
      <h2>Chat IA</h2>
      <p>Próximamente: chat con GPT...</p>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
